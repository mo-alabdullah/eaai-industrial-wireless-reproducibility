[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bsa-cppo-6g"
version = "0.1.0"
description = "Beam-and-Spectrum-Aware Constrained PPO for reliable long-range IoT over 6G (simulation)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "TBD (set before any release)" }
dependencies = [
  "stable-baselines3==2.9.0",
  "sb3-contrib==2.9.0",
  "gymnasium>=1.0,<2.0",
  "torch>=2.2",
  "numpy>=1.26",
  "scipy>=1.11",
  "pandas>=2.0",
  "matplotlib>=3.8",
  "openpyxl>=3.1",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

# Reproducibility: seeds and resolved versions recorded in REPRODUCIBILITY_MANIFEST.md.
